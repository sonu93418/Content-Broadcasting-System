<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" preserveAspectRatio="xMidYMid meet">
  <rect width="100%" height="100%" fill="#0b1220" rx="8" />
  <g transform="translate(18,18)">
    <!-- robot body (pixel style) -->
    <rect x="14" y="10" width="40" height="36" fill="#7f8cff" rx="2" />
    <rect x="6" y="26" width="56" height="6" fill="#5860a8" />
    <!-- eyes -->
    <rect x="22" y="18" width="6" height="6" fill="#fff">
      <animate attributeName="x" values="22;26;22" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="34" y="18" width="6" height="6" fill="#fff">
      <animate attributeName="x" values="34;30;34" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <!-- antenna -->
    <rect x="36" y="2" width="4" height="8" fill="#ffd166" rx="1"/>
    <circle cx="38" cy="2" r="2" fill="#ff8c42">
      <animate attributeName="cy" values="2;0;2" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <!-- waving hand (pixel) -->
    <rect x="52" y="22" width="8" height="12" fill="#7f8cff" rx="1">
      <animateTransform attributeName="transform" type="rotate" values="0 56 28;10 56 28;0 56 28" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <!-- Hi text -->
    <text x="10" y="64" font-family="monospace" font-size="10" fill="#cfe3ff">hi 👋</text>
  </g>
</svg>
