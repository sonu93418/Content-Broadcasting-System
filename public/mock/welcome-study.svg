<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#2b6cb0" />
      <stop offset="100%" stop-color="#805ad5" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0b1220" />

  <!-- Laptop body -->
  <g transform="translate(20,30)">
    <rect x="0" y="0" width="360" height="200" rx="18" fill="#0f1724" stroke="#0b1220" stroke-width="2" />

    <!-- Screen -->
    <rect x="14" y="14" width="332" height="150" rx="8" fill="url(#g1)" />

    <!-- Animated study dots inside screen -->
    <g fill="#fff" fill-opacity="0.95">
      <circle cx="40" cy="89" r="6">
        <animate attributeName="cx" values="40;170;300;40" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="89;72;110;89" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="r" values="6;8;6" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="80" cy="110" r="5" fill-opacity="0.9">
        <animate attributeName="cx" values="80;210;340;80" dur="4.2s" begin="0.2s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="110;95;120;110" dur="4.2s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="120" cy="75" r="5">
        <animate attributeName="cx" values="120;250;80;120" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="75;105;88;75" dur="3.6s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Label bar -->
    <rect x="0" y="172" width="360" height="18" rx="8" fill="#071025" />
    <text x="22" y="185" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-size="12" fill="#cfe3ff" font-weight="700">Study Mode — Welcome</text>
  </g>

</svg>
